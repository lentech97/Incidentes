services:
  - type: web
    name: incidentes-seguros
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    # El despliegue lo ordena GitHub Actions (Deploy Hook) solo si las pruebas pasan.
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 1h
      # Internal Database URL de la base PostgreSQL de Render (misma región).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANALYST_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
